name: ci

on:
  push:
  pull_request:

jobs:
  java:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - services/java/citizen-profile
          - services/java/consent-identity
          - services/java/policy-service
          - services/java/eligibility-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build and Test
        run: mvn -q test
        working-directory: ${{ matrix.service }}

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - name: Test Go Services
        run: |
          go test ./...
        working-directory: services/go

  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - services/python/asr-service
          - services/python/analytics-service
          - services/python/vector-search-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install and Test
        run: |
          pip install -r requirements.txt
          pip install pytest
          pytest -q
        working-directory: ${{ matrix.service }}

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and Start Stack
        run: docker compose -f infra/docker-compose.full.yaml up -d --build
      - name: Smoke Tests
        run: bash infra/ci-smoke.sh
      - name: Teardown
        if: always()
        run: docker compose -f infra/docker-compose.full.yaml down -v
