apiVersion: apps/v1
kind: Deployment
metadata:
  name: workflow-orchestrator
  namespace: jansaarthi
spec:
  replicas: 2
  selector:
    matchLabels:
      app: workflow-orchestrator
  template:
    metadata:
      labels:
        app: workflow-orchestrator
    spec:
      containers:
        - name: workflow-orchestrator
          image: jansaarthi/workflow-orchestrator:0.1.0
          ports:
            - containerPort: 8093
          env:
            - name: JWT_SECRET
              value: CHANGE_ME_32_CHAR_MIN_SECRET
            - name: JWT_ISSUER
              value: jan-saarthi
            - name: JWT_AUDIENCE
              value: jan-saarthi-services
            - name: OIDC_JWKS_URL
              value: http://keycloak:8080/realms/jan-saarthi/protocol/openid-connect/certs
            - name: VAULT_ADDR
              value: http://vault:8200
            - name: VAULT_TOKEN
              value: root
            - name: VAULT_SECRET_PATH
              value: secret/data/jansaarthi
---
apiVersion: v1
kind: Service
metadata:
  name: workflow-orchestrator
  namespace: jansaarthi
spec:
  selector:
    app: workflow-orchestrator
  ports:
    - port: 8093
      targetPort: 8093
